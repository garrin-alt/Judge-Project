[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragkb"
version = "0.1.0"
description = "A local RAG knowledge base: store notes/documents and retrieve them with small prompts."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastembed>=0.3,<1.0",
    "numpy>=1.24",
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]
local = ["llama-cpp-python>=0.3"]

[project.scripts]
ragkb = "ragkb.cli:main"

[tool.setuptools.packages.find]
include = ["ragkb*"]

[tool.setuptools.package-data]
ragkb = ["web/*.html"]
